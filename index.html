<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Signal P&L Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- jspdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- html2canvas for PDF image rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom background for alternating table rows */
        .bg-gray-750 {
            background-color: #3f4450; /* Slightly lighter than gray-800, darker than gray-700 */
        }
    </style>
</head>
<body class="min-h-screen bg-gray-900 flex flex-col items-center justify-center p-4 text-gray-100">

    <div class="flex flex-col md:flex-row w-full max-w-7xl gap-6">
        <!-- Signals Table - Left side -->
        <div id="signals-table-panel" class="bg-gray-800 rounded-xl shadow-2xl p-6 w-full md:w-1/2 border border-gray-700 mb-8 md:mb-0 transform hover:scale-[1.01] transition-transform duration-300 ease-in-out">
            <h2 class="text-3xl font-extrabold text-blue-400 mb-6 text-center">Active Signals Overview</h2>
            <div class="overflow-x-auto mb-6">
                <table id="signals-table" class="min-w-full bg-gray-700 rounded-lg shadow-inner overflow-hidden">
                    <thead class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white">
                        <tr>
                            <th class="py-3 px-4 text-left text-sm font-semibold uppercase tracking-wider rounded-tl-lg">Coin</th>
                            <th class="py-3 px-4 text-left text-sm font-semibold uppercase tracking-wider">Entry</th>
                            <th class="py-3 px-4 text-left text-sm font-semibold uppercase tracking-wider">Leverage</th>
                            <th class="py-3 px-4 text-left text-sm font-semibold uppercase tracking-wider">Position</th>
                            <th class="py-3 px-4 text-left text-sm font-semibold uppercase tracking-wider">Hit Price / P&L (USDT)</th>
                            <th class="py-3 px-4 text-left text-sm font-semibold uppercase tracking-wider">P&L (%)</th>
                            <th class="py-3 px-4 text-left text-sm font-semibold uppercase tracking-wider rounded-tr-lg">Action</th>
                        </tr>
                    </thead>
                    <tbody id="signals-table-body" class="divide-y divide-gray-600">
                        <!-- Signals will be inserted here by JavaScript -->
                    </tbody>
                </table>
            </div>
            <div class="text-right text-3xl font-bold text-gray-100 mt-8 p-4 bg-gray-700 rounded-lg shadow-inner border border-gray-600">
                Total Profit/Loss: <span id="total-pnl" class="text-green-400">0.00 USDT</span>
                <p id="total-pnl-percentage" class="text-xl mt-2 text-green-400">(0.00%)</p>
            </div>

            <!-- Export Buttons -->
            <div class="mt-8 flex flex-col sm:flex-row justify-center gap-4">
                <button id="export-pdf-btn" disabled class="flex items-center justify-center bg-purple-700 hover:bg-purple-800 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Export to PDF
                </button>
                <button id="export-excel-btn" disabled class="flex items-center justify-center bg-green-700 hover:bg-green-800 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Export to Excel
                </button>
                <button id="export-doc-btn" disabled class="flex items-center justify-center bg-yellow-700 hover:bg-yellow-800 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    Export to Doc
                </button>
            </div>
        </div>

        <!-- Calculator Inputs - Right side -->
        <div class="bg-gray-800 rounded-xl shadow-2xl p-6 w-full md:w-1/2 border border-gray-700 transform hover:scale-[1.01] transition-transform duration-300 ease-in-out">
            <h1 class="text-3xl font-extrabold text-blue-400 mb-6 text-center">Crypto Signal P&L Calculator (AI Powered)</h1>

            <!-- Account Size and Leverage Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="accountSize" class="block text-sm font-medium text-gray-300 mb-2">
                        Account Size (USDT):
                    </label>
                    <input
                        type="number"
                        id="accountSize"
                        class="w-full p-3 border border-gray-600 rounded-lg shadow-inner bg-gray-700 text-gray-100 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
                        value="100"
                        min="0"
                        step="any"
                    />
                </div>
                <div>
                    <label for="leverage" class="block text-sm font-medium text-gray-300 mb-2">
                        Desired Leverage (x):
                    </label>
                    <input
                        type="number"
                        id="leverage"
                        class="w-full p-3 border border-gray-600 rounded-lg shadow-inner bg-gray-700 text-gray-100 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
                        value="20"
                        min="1"
                        step="1"
                    />
                </div>
            </div>

            <!-- Signal Input -->
            <div class="mb-6">
                <label for="currentSignalText" class="block text-sm font-medium text-gray-300 mb-2">
                    Paste New Crypto Signal Here:
                </label>
                <textarea
                    id="currentSignalText"
                    class="w-full p-3 border border-gray-600 rounded-lg shadow-inner bg-gray-700 text-gray-100 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out"
                    rows="6"
                    placeholder="e.g., 📍Coin : #BTC/USDT&#10;LONG&#10;👉 Entry: 30000 - 30500&#10;🌐 Leverage: 10x&#10;🎯 Target 1: 31000&#10;❌ StopLoss: 29500"
                >📍Coin : #HIFI/USDT

🔴 SHORT 

👉 Entry: 0.1363 - 0.1399

🌐 Leverage: 20x

🎯 Target 1: 0.1350
🎯 Target 2: 0.1337
🎯 Target 3: 0.1324
🎯 Target 4: 0.1311
🎯 Target 5: 0.1297
🎯 Target 6: 0.1284

❌ StopLoss: 0.1460</textarea>
            </div>
            <button id="add-signal-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition duration-200 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105">
                Add Signal
            </button>

            <!-- Loading and Error Display -->
            <div id="loading-message" class="bg-blue-900 border border-blue-600 text-blue-200 px-4 py-3 rounded-lg relative mt-6 animate-pulse hidden" role="status">
                <div class="flex items-center justify-center">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Parsing signal with AI... Please wait.
                </div>
            </div>
            <div id="error-message" class="bg-red-900 border border-red-600 text-red-200 px-4 py-3 rounded-lg relative mt-6 hidden" role="alert">
                <strong class="font-bold">Error:</strong>
                <span id="error-text" class="block sm:inline ml-2"></span>
            </div>
        </div>
    </div>

    <script>
        // Global variables for application state
        let signals = [];
        let totalProfitLoss = 0;
        let totalInitialInvestment = 0;

        // --- Helper function to call the LLM and parse the signal text ---
        const parseSignalWithAI = async (signalText) => {
            try {
                const prompt = `Extract the following information from the crypto signal text. Provide the output in JSON format with the following keys: 'coin', 'positionType' (either 'SHORT' or 'LONG'), 'entryMin', 'entryMax', 'leverage', 'targets' (an array of numbers), and 'stopLoss'. If any information is missing or unclear, set the corresponding value to null. The 'targets' should be an array of numbers, and 'entryMin', 'entryMax', 'leverage', 'stopLoss' should all be numbers.

Signal Text:
${signalText}`;

                const chatHistory = [];
                chatHistory.push({ role: "user", parts: [{ text: prompt }] });

                const payload = {
                    contents: chatHistory,
                    generationConfig: {
                        responseMimeType: "application/json",
                        responseSchema: {
                            type: "OBJECT",
                            properties: {
                                "coin": { "type": "STRING" },
                                "positionType": { "type": "STRING" },
                                "entryMin": { "type": "NUMBER" },
                                "entryMax": { "type": "NUMBER" },
                                "leverage": { "type": "NUMBER" },
                                "targets": {
                                    "type": "ARRAY",
                                    "items": { "type": "NUMBER" }
                                },
                                "stopLoss": { "type": "NUMBER" }
                            },
                            required: ["coin", "positionType", "entryMin", "entryMax", "leverage", "targets", "stopLoss"]
                        }
                    }
                };

                const apiKey = "AIzaSyBAiLmy-UUFbMmnif3wa0yw7yqvZTBkqw4"; // Updated API Key
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

                let response;
                let result;
                let retries = 0;
                const maxRetries = 5;
                const baseDelay = 1000; // 1 second

                while (retries < maxRetries) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        result = await response.json();

                        if (result.candidates && result.candidates.length > 0 &&
                            result.candidates[0].content && result.candidates[0].content.parts &&
                            result.candidates[0].content.parts.length > 0) {
                            const json = result.candidates[0].content.parts[0].text;
                            const parsedJson = JSON.parse(json);
                            return parsedJson;
                        } else {
                            throw new Error("Unexpected API response structure.");
                        }
                    } catch (error) {
                        if (response && response.status === 429 && retries < maxRetries - 1) { // Too Many Requests
                            const delay = baseDelay * Math.pow(2, retries);
                            console.warn(`Rate limit hit, retrying in ${delay}ms...`);
                            await new Promise(res => setTimeout(res, delay));
                            retries++;
                        } else {
                            throw error; // Re-throw if not a rate limit or max retries reached
                        }
                    }
                }
                throw new Error("Failed to get a valid response from the API after multiple retries.");

            } catch (error) {
                console.error("Error parsing signal with AI:", error);
                return { error: `AI parsing failed: ${error.message}. Please check signal format.` };
            }
        };

        // --- Main calculation logic ---
        const calculateProfitLoss = (parsedSignal, accountSize, selectedLeverage) => {
            if (parsedSignal.error) {
                return { error: parsedSignal.error };
            }

            const { coin, positionType, entryMin, entryMax, leverage, targets, stopLoss } = parsedSignal;

            if (!coin || entryMin === null || entryMax === null || leverage === null || stopLoss === null || !targets || targets.length === 0 || !positionType) {
                return { error: "Parsed signal is incomplete. Please ensure all details are present." };
            }

            const entryPrice = (entryMin + entryMax) / 2;
            const initialInvestment = accountSize; // This is the collateral
            const positionSize = initialInvestment * selectedLeverage; // Value of the assets being traded
            const contractAmount = positionSize / entryPrice; // Number of coins/contracts

            const results = {
                coin,
                entryPrice,
                leverage: selectedLeverage,
                signalLeverage: leverage,
                initialInvestment,
                positionSize,
                contractAmount,
                positionType
            };

            const calculatePnL = (currentPrice) => {
                let pnl = 0;
                if (positionType === 'SHORT') {
                    pnl = (entryPrice - currentPrice) * contractAmount;
                } else {
                    pnl = (currentPrice - entryPrice) * contractAmount;
                }
                return pnl;
            };

            results.targets = targets.map((targetPrice) => ({
                price: targetPrice,
                pnl: calculatePnL(targetPrice)
            }));

            results.stopLoss = {
                price: stopLoss,
                pnl: calculatePnL(stopLoss)
            };

            return results;
        };

        // --- DOM Elements ---
        const currentSignalTextarea = document.getElementById('currentSignalText');
        const accountSizeInput = document.getElementById('accountSize');
        const leverageInput = document.getElementById('leverage');
        const addSignalBtn = document.getElementById('add-signal-btn');
        const loadingMessage = document.getElementById('loading-message');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const signalsTableBody = document.getElementById('signals-table-body');
        const totalPnlSpan = document.getElementById('total-pnl');
        const totalPnlPercentageP = document.getElementById('total-pnl-percentage');
        const signalsTablePanel = document.getElementById('signals-table-panel'); // The left panel container
        const exportPdfBtn = document.getElementById('export-pdf-btn');
        const exportExcelBtn = document.getElementById('export-excel-btn');
        const exportDocBtn = document.getElementById('export-doc-btn');

        // --- Utility Functions ---
        const updateError = (message) => {
            if (message) {
                errorText.textContent = message;
                errorMessage.classList.remove('hidden');
            } else {
                errorMessage.classList.add('hidden');
                errorText.textContent = '';
            }
        };

        const updateLoading = (isLoading) => {
            if (isLoading) {
                loadingMessage.classList.remove('hidden');
                addSignalBtn.disabled = true;
            } else {
                loadingMessage.classList.add('hidden');
                addSignalBtn.disabled = false;
            }
        };

        const renderSignalsTable = () => {
            signalsTableBody.innerHTML = ''; // Clear existing rows
            if (signals.length === 0) {
                signalsTablePanel.classList.add('hidden'); // Hide the entire left panel if no signals
                exportPdfBtn.disabled = true;
                exportExcelBtn.disabled = true;
                exportDocBtn.disabled = true;
                return;
            } else {
                signalsTablePanel.classList.remove('hidden'); // Show if there are signals
                exportPdfBtn.disabled = false;
                exportExcelBtn.disabled = false;
                exportDocBtn.disabled = false;
            }

            signals.forEach((signal, index) => {
                const row = signalsTableBody.insertRow();
                row.classList.add(index % 2 === 0 ? 'bg-gray-700' : 'bg-gray-750', 'hover:bg-gray-600', 'transition-colors', 'duration-200', 'ease-in-out');

                // Coin
                const coinCell = row.insertCell();
                coinCell.classList.add('py-3', 'px-4', 'text-blue-300', 'font-medium');
                coinCell.textContent = signal.parsedSignal.coin;

                // Entry
                const entryCell = row.insertCell();
                entryCell.classList.add('py-3', 'px-4', 'text-gray-200');
                entryCell.textContent = `${signal.parsedSignal.entryMin.toFixed(4)} - ${signal.parsedSignal.entryMax.toFixed(4)}`;

                // Leverage
                const leverageCell = row.insertCell();
                leverageCell.classList.add('py-3', 'px-4', 'text-gray-200');
                leverageCell.textContent = `${signal.selectedLeverage}x`;

                // Position
                const positionCell = row.insertCell();
                positionCell.classList.add('py-3', 'px-4', 'text-gray-200');
                positionCell.textContent = signal.parsedSignal.positionType;

                // Hit Price / P&L (USDT)
                const hitPnlCell = row.insertCell();
                hitPnlCell.classList.add('py-3', 'px-4');
                const selectElement = document.createElement('select');
                selectElement.classList.add('block', 'w-full', 'rounded-md', 'border', 'border-gray-600', 'bg-gray-800', 'text-gray-200', 'shadow-sm', 'focus:border-blue-500', 'focus:ring-blue-500', 'sm:text-sm', 'p-2', 'transition-all', 'duration-200');
                selectElement.dataset.signalId = signal.id; // Store signal ID

                signal.calculationResults.targets.forEach((tp, idx) => {
                    const option = document.createElement('option');
                    option.value = `TP-${idx}`;
                    option.textContent = `Target ${idx + 1} (${tp.price.toFixed(4)} | P&L: ${tp.pnl.toFixed(2)})`;
                    selectElement.appendChild(option);
                });
                const slOption = document.createElement('option');
                slOption.value = 'SL';
                slOption.textContent = `Stop Loss (${signal.calculationResults.stopLoss.price.toFixed(4)} | P&L: ${signal.calculationResults.stopLoss.pnl.toFixed(2)})`;
                selectElement.appendChild(slOption);

                // Set selected option
                if (signal.hitPriceType === 'SL') {
                    selectElement.value = 'SL';
                } else {
                    selectElement.value = `TP-${signal.hitPriceIndex}`;
                }

                selectElement.addEventListener('change', (event) => {
                    const id = parseInt(event.target.dataset.signalId, 10);
                    const [type, index] = event.target.value.split('-');
                    handleHitPriceChange(id, type, index ? parseInt(index, 10) : null);
                });
                hitPnlCell.appendChild(selectElement);

                const pnlText = document.createElement('p');
                pnlText.classList.add('text-sm', 'mt-1', signal.hitPnl >= 0 ? 'text-green-400' : 'text-red-400', 'font-semibold');
                pnlText.textContent = `Actual P&L: ${signal.hitPnl.toFixed(2)} USDT`;
                hitPnlCell.appendChild(pnlText);

                // P&L (%)
                const pnlPercentageCell = row.insertCell();
                pnlPercentageCell.classList.add('py-3', 'px-4', signal.pnlPercentage >= 0 ? 'text-green-400' : 'text-red-400', 'font-semibold');
                pnlPercentageCell.textContent = `${signal.pnlPercentage.toFixed(2)}%`;

                // Action (Remove Button)
                const actionCell = row.insertCell();
                actionCell.classList.add('py-3', 'px-4');
                const removeBtn = document.createElement('button');
                removeBtn.classList.add('bg-red-600', 'hover:bg-red-700', 'text-white', 'font-bold', 'py-2', 'px-3', 'rounded-lg', 'shadow-md', 'transition', 'duration-200', 'ease-in-out', 'text-sm', 'transform', 'hover:scale-105');
                removeBtn.textContent = 'Remove';
                removeBtn.addEventListener('click', () => removeSignal(signal.id));
                actionCell.appendChild(removeBtn);
            });

            // Update total P&L display
            totalPnlSpan.textContent = `${totalProfitLoss.toFixed(2)} USDT`;
            totalPnlSpan.classList.remove('text-green-400', 'text-red-400');
            totalPnlSpan.classList.add(totalProfitLoss >= 0 ? 'text-green-400' : 'text-red-400');

            if (totalInitialInvestment > 0) {
                const overallPnlPercentage = (totalProfitLoss / totalInitialInvestment) * 100;
                totalPnlPercentageP.textContent = `(${overallPnlPercentage.toFixed(2)}%)`;
                totalPnlPercentageP.classList.remove('hidden', 'text-green-400', 'text-red-400');
                totalPnlPercentageP.classList.add(overallPnlPercentage >= 0 ? 'text-green-400' : 'text-red-400');
            } else {
                totalPnlPercentageP.classList.add('hidden');
            }
        };

        // --- Event Handlers ---
        const handleAddSignal = async () => {
            const currentSignalText = currentSignalTextarea.value;
            const accountSize = parseFloat(accountSizeInput.value);
            const selectedLeverage = parseInt(leverageInput.value, 10);

            if (!currentSignalText.trim()) {
                updateError('Please paste a signal to add.');
                return;
            }
            if (isNaN(accountSize) || accountSize <= 0 || isNaN(selectedLeverage) || selectedLeverage <= 0) {
                updateError('Account size and leverage must be valid positive numbers.');
                return;
            }

            updateLoading(true);
            updateError('');

            const parsedSignal = await parseSignalWithAI(currentSignalText);

            if (parsedSignal.error) {
                updateError(parsedSignal.error);
            } else {
                const calculationResults = calculateProfitLoss(parsedSignal, accountSize, selectedLeverage);
                if (calculationResults.error) {
                    updateError(calculationResults.error);
                } else {
                    let initialHitPnl = calculationResults.targets.length > 0 ? calculationResults.targets[0].pnl : 0;
                    const pnlPercentage = (initialHitPnl / accountSize) * 100;

                    signals.push({
                        id: Date.now(),
                        signalText: currentSignalText,
                        accountSize,
                        selectedLeverage,
                        parsedSignal,
                        calculationResults,
                        hitPriceType: 'TP',
                        hitPriceIndex: 0,
                        hitPnl: initialHitPnl,
                        pnlPercentage: pnlPercentage
                    });
                    currentSignalTextarea.value = ''; // Clear input
                    updateSignalsState();
                }
            }
            updateLoading(false);
        };

        const handleHitPriceChange = (id, type, index = null) => {
            signals = signals.map(signal => {
                if (signal.id === id) {
                    let hitPnl = 0;
                    if (type === 'TP' && index !== null && signal.calculationResults.targets[index]) {
                        hitPnl = signal.calculationResults.targets[index].pnl;
                    } else if (type === 'SL') {
                        hitPnl = signal.calculationResults.stopLoss.pnl;
                    }
                    const pnlPercentage = (hitPnl / signal.accountSize) * 100;
                    return {
                        ...signal,
                        hitPriceType: type,
                        hitPriceIndex: index,
                        hitPnl: hitPnl,
                        pnlPercentage: pnlPercentage
                    };
                }
                return signal;
            });
            updateSignalsState();
        };

        const removeSignal = (id) => {
            signals = signals.filter(signal => signal.id !== id);
            updateSignalsState();
        };

        // Function to update global state and re-render the table
        const updateSignalsState = () => {
            totalProfitLoss = signals.reduce((sum, signal) => sum + signal.hitPnl, 0);
            totalInitialInvestment = signals.reduce((sum, signal) => sum + signal.accountSize, 0);
            renderSignalsTable();
        };

        // --- Export Functions ---
        const exportToPdf = () => {
            const input = document.getElementById('signals-table'); // Target the table element directly
            if (!input) {
                updateError('Could not find table to export.');
                return;
            }

            // Temporarily hide action column for cleaner PDF
            const actionColumnHeader = input.querySelector('th:last-child');
            const actionCells = input.querySelectorAll('td:last-child');
            const originalHeaderDisplay = actionColumnHeader ? actionColumnHeader.style.display : '';
            const originalCellsDisplay = Array.from(actionCells).map(cell => cell.style.display);

            if (actionColumnHeader) actionColumnHeader.style.display = 'none';
            actionCells.forEach(cell => cell.style.display = 'none');

            html2canvas(input, { scale: 2, useCORS: true }).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jspdf.jsPDF({
                    orientation: 'landscape',
                    unit: 'px',
                    format: 'a4'
                });

                const imgWidth = pdf.internal.pageSize.getWidth();
                const imgHeight = (canvas.height * imgWidth) / canvas.width;
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);

                // Add total P&L below the table image
                pdf.setFontSize(12);
                pdf.text(`Total P&L: ${totalProfitLoss.toFixed(2)} USDT (${(totalInitialInvestment > 0 ? (totalProfitLoss / totalInitialInvestment) * 100 : 0).toFixed(2)}%)`, 10, imgHeight + 20);

                pdf.save("crypto_signals_report.pdf");

                // Restore original visibility
                if (actionColumnHeader) actionColumnHeader.style.display = originalHeaderDisplay;
                actionCells.forEach((cell, i) => cell.style.display = originalCellsDisplay[i]);
            }).catch(err => {
                console.error("Error generating PDF:", err);
                updateError("Failed to generate PDF. Please try again.");
                // Ensure visibility is restored even on error
                if (actionColumnHeader) actionColumnHeader.style.display = originalHeaderDisplay;
                actionCells.forEach((cell, i) => cell.style.display = originalCellsDisplay[i]);
            });
        };

        const exportToExcel = () => {
            if (signals.length === 0) {
                updateError('No signals to export to Excel.');
                return;
            }

            const data = [
                ["Coin", "Entry Min", "Entry Max", "Account Size", "Leverage Used", "Position Type", "Hit Type", "Hit Price", "P&L (USDT)", "P&L (%)"]
            ];

            signals.forEach(signal => {
                const hitPrice = signal.hitPriceType === 'SL'
                    ? signal.calculationResults.stopLoss.price
                    : signal.calculationResults.targets[signal.hitPriceIndex]?.price || 'N/A';

                data.push([
                    signal.parsedSignal.coin,
                    signal.parsedSignal.entryMin,
                    signal.parsedSignal.entryMax,
                    signal.accountSize,
                    signal.selectedLeverage,
                    signal.parsedSignal.positionType,
                    signal.hitPriceType === 'SL' ? 'Stop Loss' : `Target ${signal.hitPriceIndex + 1}`,
                    hitPrice,
                    signal.hitPnl,
                    signal.pnlPercentage
                ]);
            });

            data.push([]); // Empty row for separation
            const totalPnlPercentage = totalInitialInvestment > 0 ? (totalProfitLoss / totalInitialInvestment) * 100 : 0;
            data.push(["", "", "", "", "", "", "", "Total P&L:", totalProfitLoss, totalPnlPercentage]);


            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Crypto Signals Report");
            XLSX.writeFile(wb, "crypto_signals_report.xlsx");
        };

        const exportToDoc = () => {
            if (signals.length === 0) {
                updateError('No signals to export to Doc.');
                return;
            }

            let docContent = "Crypto Signals Report\n\n";
            docContent += `Account Size per Signal (for calculations): ${accountSizeInput.value} USDT\n`;
            docContent += `Desired Leverage (for calculations): ${leverageInput.value}x\n`;
            docContent += `Total Initial Investment Across Signals: ${totalInitialInvestment.toFixed(2)} USDT\n\n`;

            signals.forEach((signal, index) => {
                docContent += `--- Signal ${index + 1} ---\n`;
                docContent += `Coin: ${signal.parsedSignal.coin}\n`;
                docContent += `Position Type: ${signal.parsedSignal.positionType}\n`;
                docContent += `Entry: ${signal.parsedSignal.entryMin.toFixed(4)} - ${signal.parsedSignal.entryMax.toFixed(4)}\n`;
                docContent += `Leverage (Signal): ${signal.parsedSignal.signalLeverage}x\n`;
                docContent += `Leverage (Used): ${signal.selectedLeverage}x\n`;
                docContent += `Initial Investment for this Signal: ${signal.initialInvestment.toFixed(2)} USDT\n`;
                docContent += `Position Size: ${signal.positionSize.toFixed(2)} USDT\n`;
                docContent += `Contract Amount: ${signal.contractAmount.toFixed(4)} ${signal.parsedSignal.coin}\n`;

                docContent += "Targets:\n";
                signal.calculationResults.targets.forEach((tp, idx) => {
                    docContent += `- Target ${idx + 1}: ${tp.price.toFixed(4)} (P&L: ${tp.pnl.toFixed(2)} USDT)\n`;
                });
                docContent += `Stop Loss: ${signal.calculationResults.stopLoss.price.toFixed(4)} (P&L: ${signal.calculationResults.stopLoss.pnl.toFixed(2)} USDT)\n`;

                const hitPrice = signal.hitPriceType === 'SL'
                    ? signal.calculationResults.stopLoss.price
                    : signal.calculationResults.targets[signal.hitPriceIndex]?.price || 'N/A';
                const hitPriceLabel = signal.hitPriceType === 'SL' ? 'Stop Loss' : `Target ${signal.hitPriceIndex + 1}`;

                docContent += `Outcome: ${hitPriceLabel} hit at ${hitPrice.toFixed(4)}\n`;
                docContent += `Signal P&L: ${signal.hitPnl.toFixed(2)} USDT (${signal.pnlPercentage.toFixed(2)}%)\n\n`;
            });

            const totalPnlPercentage = totalInitialInvestment > 0 ? (totalProfitLoss / totalInitialInvestment) * 100 : 0;
            docContent += `===================================\n`;
            docContent += `TOTAL PROFIT/LOSS: ${totalProfitLoss.toFixed(2)} USDT (${totalPnlPercentage.toFixed(2)}%)\n`;
            docContent += `===================================\n`;


            const blob = new Blob([docContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'crypto_signals_report.doc'; // .doc extension for simple text doc
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };


        // --- Initialize on DOMContentLoaded ---
        document.addEventListener('DOMContentLoaded', () => {
            addSignalBtn.addEventListener('click', handleAddSignal);
            exportPdfBtn.addEventListener('click', exportToPdf);
            exportExcelBtn.addEventListener('click', exportToExcel);
            exportDocBtn.addEventListener('click', exportToDoc);

            // Initial render of the table (will be empty)
            renderSignalsTable();
        });
    </script>
</body>
</html>
